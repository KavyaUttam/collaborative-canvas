<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collaborative Canvas</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <header class="toolbar" aria-label="Drawing tools">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <h1 class="brand__name">Collaborative Canvas</h1>
        </div>

        <div class="toolbar__group" role="group" aria-label="Tools">
          <button type="button" id="tool-brush" class="tool is-active" title="Brush">
            Brush
          </button>
          <button type="button" id="tool-eraser" class="tool" title="Eraser">
            Eraser
          </button>
          <button type="button" id="tool-undo" class="tool" title="Undo last stroke (global)">
            Undo
          </button>
          <button type="button" id="tool-redo" class="tool" title="Redo (global)">
            Redo
          </button>
          <button type="button" id="tool-clear" class="tool tool--danger" title="Clear canvas">
            Clear
          </button>
        </div>

        <div class="toolbar__group" role="group" aria-label="Brush settings">
          <label class="field">
            <span class="field__label">Color</span>
            <input type="color" id="color-picker" value="#1a1a1a" />
          </label>
          <label class="field field--range">
            <span class="field__label">Size <span id="brush-width-label">4px</span></span>
            <input type="range" id="brush-width" min="1" max="40" value="4" />
          </label>
        </div>

        <div class="toolbar__meta">
          <span id="connection-status" class="status" data-state="offline">Disconnected</span>
        </div>
      </header>

      <div class="workspace">
        <aside class="presence" aria-label="Online users">
          <h2 class="presence__title">Online</h2>
          <ul id="user-list" class="user-list"></ul>
        </aside>

        <main class="stage">
          <canvas id="drawing-canvas" aria-label="Drawing surface"></canvas>
          <div id="cursor-overlay" class="cursor-overlay" aria-hidden="true"></div>
        </main>
      </div>
    </div>
    <script src="/bundle.js"></script>
    <footer class="app-footer">Designed & Developed by<strong>Kavya Uttam</strong>
    </footer>
  </body>
</html>
